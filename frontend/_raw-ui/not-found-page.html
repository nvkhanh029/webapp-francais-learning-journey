<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="web_standard" name="shell-type">
    <title>Français Learning Journey | Không tìm thấy trang</title>

    <!-- Fonts and original illustrations still require an internet connection. -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" crossorigin="" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..800;1,6..12,300..800&amp;display=swap"
        rel="stylesheet">

    <!--
      Static NotFoundPage prototype (route "*", frontend 404 fallback), normalized against the
      approved Dashboard (dashboard-page.html), the focused Login page (login-page.html), and
      frontend-design.md (FD) §4.2, §4.8, §7. Plain CSS, no build step.

      Role:
      - Rendered by React Router for any unknown FRONTEND URL, instead of a blank screen
        (FD §4.8). It is not an API error page, an expired-session page, a network-error page,
        or a permission page. /api/v1/... stays with Flask and never reaches this page.
      - Needs no data: no API call, session check, request metadata, or personalization.

      Shell:
      - The route sits outside the auth guards (FD §4.3), so the page may be shown to a guest
        or to a signed-in learner. It therefore uses a neutral shell: brand only, with no main
        navigation, no language selector, no logout, and no Register button. Nothing in the
        header claims the invalid URL belongs to Grammar, Vocabulary, or Conjugation.

      Recovery actions (supported destinations only):
      - Primary: "/dashboard" (data-route). RequireAuth (FD §4.3.1) already sends a guest who
        opens it on to /login, so this page needs no auth-aware branching.
      - Secondary: previous page. React integration: navigate(-1), and hide the button when
        location.key === "default" (nothing to go back to). The static script below mimics that.
      - No search, support form, report-a-link flow, or feature directory (not in the MVP).
      - Links use href="#" with the target React route in data-route (FD §4.2).

      Fixed copy is frontend-owned and belongs in the VI/EN dictionaries (FD §9.1).

      Page sections:
      1. Header (brand only)
      2. Not-found card
      3. Footer
    -->
    <style>
        /* ======================================================================
         1. Theme and base styles
         Tokens are identical to dashboard-page.html and login-page.html (FD §7.3, §7.4).
         ====================================================================== */
        :root {
            --font-body: "Nunito Sans", sans-serif;
            --font-heading: "Be Vietnam Pro", sans-serif;

            --text-caption: 0.75rem;
            --text-label: 0.8125rem;
            --text-body: 0.9375rem;
            --text-brand: 1.125rem;
            --text-display: 1.75rem;
            --leading-body: 1.6;
            --leading-heading: 1.4;
            --leading-label: 1.5;
            --tracking-heading: -0.015em;
            --tracking-label: 0.01em;

            --color-background: #faf7f2;
            --color-card: #ffffff;
            --color-border: #eadbcc;
            --color-heading: #2b2118;
            --color-text: #231918;
            --color-muted: #554336;

            --color-primary: #8d4b00;
            --color-primary-dark: #6b3700;
            --color-primary-soft: #fff5e6;
            --color-primary-border: #f0dec0;

            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.25rem;
            --page-padding: var(--space-md);
            --radius-card: 1.5rem;
            --radius-small: 1rem;

            --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: var(--text-body);
            line-height: var(--leading-body);
            overscroll-behavior: none;
        }

        [hidden] {
            display: none !important;
        }

        h1,
        p {
            margin: 0;
        }

        h1,
        .brand-name {
            font-family: var(--font-heading);
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        ::selection {
            background: #ffdcc3;
            color: #2f1500;
        }

        /* Google Material Symbols are decorative; their labels stay in the HTML. */
        .material-symbols-outlined {
            display: inline-block;
            flex-shrink: 0;
            /* Reserve icon space even while the external icon font is loading. */
            width: 1em;
            height: 1em;
            overflow: hidden;
            font-family: "Material Symbols Outlined";
            font-size: 20px;
            font-style: normal;
            font-weight: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        /* ======================================================================
         2. Shared layout and components (same rules as dashboard-page.html, FD §7.6)
         ====================================================================== */
        .page-container {
            width: 100%;
            max-width: 1280px;
            margin-inline: auto;
            padding-inline: var(--page-padding);
        }

        .card {
            min-width: 0;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            background: var(--color-card);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border: 1px solid var(--color-border);
            border-radius: 9999px;
            background: var(--color-background);
            color: var(--color-primary-dark);
            font-size: var(--text-caption);
            font-weight: 700;
            line-height: var(--leading-label);
        }

        .badge .material-symbols-outlined {
            font-size: 16px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            min-height: 48px;
            border: 0;
            border-radius: var(--radius-small);
            font-family: var(--font-body);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            transition: background-color 150ms, color 150ms, box-shadow 150ms, transform 150ms;
        }

        .button-primary {
            padding: 12px var(--space-lg);
            background: var(--color-heading);
            color: #ffffff;
            font-size: var(--text-body);
            line-height: var(--leading-label);
            box-shadow: var(--shadow-sm);
        }

        .button-primary:hover {
            background: #1f1711;
            box-shadow: var(--shadow-md);
        }

        .button-primary:active {
            transform: translateY(2px);
        }

        .button-secondary {
            padding: 12px var(--space-lg);
            border: 1px solid var(--color-border);
            background: var(--color-background);
            color: var(--color-heading);
            font-size: var(--text-body);
            line-height: var(--leading-label);
            letter-spacing: var(--tracking-label);
        }

        .button-secondary:hover {
            background: var(--color-heading);
            color: #ffffff;
        }

        /* Trailing arrows shift right on hover (shared interaction); the leading back arrow
           shifts left so it keeps pointing the way it moves. */
        .button .material-symbols-outlined {
            transition: transform 150ms;
        }

        .button:hover .material-symbols-outlined {
            transform: translateX(4px);
        }

        .button:hover .icon-back {
            transform: translateX(-4px);
        }

        /* ======================================================================
         3. Header (neutral shell): brand only. The route is a global fallback, so no
         navigation, language selector, logout, or Register button.
         ====================================================================== */
        .site-header {
            position: fixed;
            z-index: 50;
            top: 0;
            width: 100%;
            border-bottom: 1px solid var(--color-border);
            background: rgb(255 255 255 / 92%);
            box-shadow: 0 2px 12px -2px rgb(50 30 10 / 4%);
            backdrop-filter: blur(24px);
        }

        .header-content {
            display: flex;
            align-items: center;
            height: 80px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            min-width: 0;
            border-radius: var(--radius-small);
        }

        .brand-logo {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .brand-name {
            min-width: 0;
            color: var(--color-primary);
            font-size: var(--text-body);
            font-weight: 700;
            line-height: var(--leading-heading);
            letter-spacing: var(--tracking-heading);
        }

        /* ======================================================================
         4. Not-found card
         Focused, centered composition like Login: light, one message, one way out.
         ====================================================================== */
        .not-found-main {
            display: flex;
            flex: 1;
            align-items: center;
            padding-top: calc(80px + var(--space-lg));
            padding-bottom: var(--space-xl);

            /* Same subtle pattern treatment as the Login page. */
            background:
                linear-gradient(rgb(250 247 242 / 84%),
                    rgb(250 247 242 / 84%)),
                url("/images/croissant-pattern.png");

            background-repeat: repeat;
            background-size: auto, 800px auto;
            background-position: center;
        }

        .not-found-layout {
            display: flex;
            justify-content: center;
        }

        /* Page-only width keeps the message comfortable instead of stretching to 1280px. */
        .not-found-card {
            width: 100%;
            max-width: 36rem;
            padding: var(--space-lg);
            text-align: center;
        }

        /* Decorative mascot, secondary to the message. */
        .not-found-mascot {
            width: 96px;
            height: 96px;
            margin: 0 auto var(--space-md);
            object-fit: contain;
            user-select: none;
        }

        .not-found-title {
            margin-top: var(--space-sm);
            color: var(--color-heading);
            font-size: var(--text-display);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: var(--tracking-heading);
        }

        .not-found-lead {
            max-width: 26rem;
            margin: var(--space-sm) auto 0;
            color: var(--color-muted);
            font-size: var(--text-body);
            line-height: var(--leading-body);
        }

        .not-found-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-lg);
        }

        .not-found-actions .button {
            width: 100%;
        }

        /* ======================================================================
         5. Footer (same as dashboard-page.html) and responsive layout (FD §8)
         ====================================================================== */
        .site-footer {
            width: 100%;
            border-top: 1px solid var(--color-border);
            background: var(--color-background);
        }

        .footer-content {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding-block: var(--space-lg);
            color: var(--color-muted);
            font-size: var(--text-label);
            font-weight: 600;
            line-height: var(--leading-label);
            letter-spacing: var(--tracking-label);
        }

        .footer-content .material-symbols-outlined {
            color: var(--color-primary);
        }

        @media (min-width: 640px) {
            :root {
                --page-padding: var(--space-lg);
                --text-display: 2rem;
            }

            .brand {
                gap: var(--space-md);
            }

            .brand-logo {
                width: 36px;
                height: 36px;
            }

            .brand-name {
                font-size: var(--text-brand);
                white-space: nowrap;
            }

            .not-found-card {
                padding: var(--space-xl);
            }

            /* Actions sit side by side, sized to their labels. */
            .not-found-actions {
                flex-direction: row;
                justify-content: center;
                gap: var(--space-md);
            }

            .not-found-actions .button {
                width: auto;
            }
        }

        @media (min-width: 1024px) {
            :root {
                --page-padding: 2.5rem;
            }

            .not-found-main {
                padding-top: calc(80px + var(--space-xl));
            }

            .not-found-card {
                padding: calc(var(--space-xl) * 1.5) var(--space-xl);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- 1. Header -->
    <header class="site-header">
        <div class="page-container header-content">
            <a class="brand" href="#" data-route="/">
                <img class="brand-logo"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgWt9pRunIXVtG0B6JvfhoCJ5io4tHLn_61ZNuF0BAfzmsMVAEg_8wG3kpnezQaaBbtylHFmC-2l2XDeNOus5u1d3-F9R67TK_wYgdsQW5Kgxz4QxhEJOBmSjPwFjEVkePSXmBpSSQNmvGIZORFN8x1fZIoe_5jKewqlocXfrymAv1c9OzwZBO7Uh5E2dRbnhrQH6Nb9-3uQcOw1gpTd5zbpPKhjGLPTS1qKrcOr_HPxbkG6k7PPkjwWoKIxsMk9jh-w"
                    alt="">
                <span class="brand-name">Français Learning Journey</span>
            </a>
        </div>
    </header>

    <main class="not-found-main" id="main-content">
        <div class="page-container not-found-layout">

            <!-- 2. Not-found card -->
            <section class="card not-found-card" aria-labelledby="not-found-title">
                <!-- Decorative: the heading and text carry the whole message. -->
                <img class="not-found-mascot"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgWt9pRunIXVtG0B6JvfhoCJ5io4tHLn_61ZNuF0BAfzmsMVAEg_8wG3kpnezQaaBbtylHFmC-2l2XDeNOus5u1d3-F9R67TK_wYgdsQW5Kgxz4QxhEJOBmSjPwFjEVkePSXmBpSSQNmvGIZORFN8x1fZIoe_5jKewqlocXfrymAv1c9OzwZBO7Uh5E2dRbnhrQH6Nb9-3uQcOw1gpTd5zbpPKhjGLPTS1qKrcOr_HPxbkG6k7PPkjwWoKIxsMk9jh-w"
                    alt="">
                <p class="badge">
                    <span class="material-symbols-outlined" aria-hidden="true">link_off</span>
                    <span>Lỗi 404</span>
                </p>
                <h1 class="not-found-title" id="not-found-title">Không tìm thấy trang</h1>
                <p class="not-found-lead">Trang này không tồn tại hoặc địa chỉ đã bị nhập sai.<br> Hãy quay lại để tiếp
                    tục học nhé.</p>

                <div class="not-found-actions">
                    <button class="button button-secondary" type="button" data-action="go-back">
                        <span class="material-symbols-outlined icon-back" aria-hidden="true">arrow_back</span>
                        <span>Quay lại trang trước</span>
                    </button>

                    <a class="button button-primary" href="#" data-route="/dashboard">
                        <span>Về bảng điều khiển</span>
                        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <!-- 3. Footer -->
    <footer class="site-footer">
        <div class="page-container footer-content">
            <span class="material-symbols-outlined" aria-hidden="true">auto_stories</span>
            <span>Français Learning Journey • Hành trình chinh phục tiếng Pháp</span>
        </div>
    </footer>

    <script>
        // UI prototype only. No routing, session, or API logic is implemented here.
        // React integration: replace with useNavigate(-1) and hide the button when
        // location.key === "default".
        (() => {
            const backButton = document.querySelector('[data-action="go-back"]');
            if (window.history.length <= 1) {
                backButton.hidden = true;
                return;
            }
            backButton.addEventListener("click", () => window.history.back());
        })();
    </script>
</body>

</html>
